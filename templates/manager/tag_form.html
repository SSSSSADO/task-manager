{% extends "base.html" %}

{% block title %}
  <title>
    {% if task %}
      Tag Update
    {% else %}
      Tag Create
    {% endif %}
  </title>
{% endblock %}

{% block content %}
  {% if tag %}
    <h1>{{ tag.name }} Update</h1>
  {% else %}
    <h1>Tag Create</h1>
  {% endif %}

  <form action="" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Submit">
  </form>
{% endblock %}
