{% extends "base.html" %}

{% block title %}
  <title>Tags</title>
{% endblock %}

{% block content %}
  <h1>
    Tags
    <a style="float:right" href="#">Add</a>
  </h1>

  <table border="1" cellpadding="10" cellspacing="0">
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>

    {% for tag in tag_list %}
      <tr>
        <td>{{ tag.name }}</td>

        <td>
          <a href="#">Update</a>
        </td>

        <td>
          <a href="#">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3">No tags found</td>
      </tr>
    {% endfor %}
  </table>

{% endblock %}
